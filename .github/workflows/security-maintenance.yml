name: Node security validation
on:
  pull_request: {}
  push:
    branches:
      - build
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Locked install, checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up the project's Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      # Uses the packageManager version from package.json.
      - name: Set up the project package manager
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace contracts
        run: |-
          pnpm --filter @domain-scout/contracts build
          pnpm --filter @domain-scout/api-client build
      - name: Generate Next.js route types
        working-directory: apps/web
        run: pnpm exec next typegen
      - name: Lint, typecheck and test the workspace
        run: pnpm check
      - name: Build the workspace
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
