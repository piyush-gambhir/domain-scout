





services:
  domain-scout:
    build:
      context: .
    image: domain-scout:local
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    environment:

      DOMAIN_SCOUT_PUBLIC_PORT: ${DOMAIN_SCOUT_PORT:-3000}
    ports:
      - "127.0.0.1:${DOMAIN_SCOUT_PORT:-3000}:3000"
    volumes:
      - domain-scout-data:/data

volumes:
  domain-scout-data:
